function getWeekStart() {
  var d = new Date(),
    day = d.getDay(),
    diff = d.getDate() - day + (day === 0 ? -6 : 1);
  return new Date(new Date(d).setDate(diff)).toISOString().split('T')[0];
}
function loadRuns() {
  var data = load(K.RUNS, {});
  var ws = getWeekStart();
  if (data.weekStart !== ws) {
    data.weeklyKm = 0;
    data.weekStart = ws;
  }
  return {
    runs: data.runs || [],
    weeklyKm: data.weeklyKm || 0,
    streak: data.streak || 0,
    lastRunDate: data.lastRunDate || null,
    weekStart: data.weekStart || ws,
    stravaSync: data.stravaSync || 0
  };
}
function saveRun(entry) {
  var s = loadRuns(),
    today = todayStr();
  s.runs = [Object.assign({}, entry, {
    date: today
  })].concat(s.runs).slice(0, 200);
  s.weeklyKm = Math.round((s.weeklyKm + (parseFloat(entry.distKm) || 0)) * 10) / 10;
  var yd = new Date(Date.now() - 86400000).toISOString().split('T')[0];
  if (!s.lastRunDate || s.lastRunDate === yd) {
    if (s.lastRunDate !== today) s.streak = (s.streak || 0) + 1;
  } else if (s.lastRunDate !== today) s.streak = 1;
  s.lastRunDate = today;
  store(K.RUNS, s);
  return s;
}
function mergeStravaRuns(newOnes) {
  var s = loadRuns(),
    existing = s.runs || [];
  var merged = newOnes.concat(existing).filter(function (r, i, arr) {
    return !arr.slice(0, i).find(function (e) {
      return e.stravaId && e.stravaId === r.stravaId;
    });
  }).sort(function (a, b) {
    return b.date > a.date ? 1 : b.date < a.date ? -1 : 0;
  }).slice(0, 200);
  s.runs = merged;
  var ws = getWeekStart();
  s.weeklyKm = Math.round(merged.filter(function (r) {
    return r.date && r.date >= ws;
  }).reduce(function (acc, r) {
    return acc + (parseFloat(r.distKm) || 0);
  }, 0) * 10) / 10;

  // Recalculate streak properly from run dates
  var runDates = merged.map(function (r) {
    return r.date;
  }).filter(Boolean);
  var uniqueDates = [...new Set(runDates)].sort().reverse();
  var streak = 0;
  var checkDate = new Date();
  for (var i = 0; i < uniqueDates.length; i++) {
    var d = uniqueDates[i];
    var expected = new Date(checkDate);
    expected.setDate(expected.getDate() - (streak === 0 ? 0 : 1));
    var expStr = expected.toISOString().split('T')[0];
    // Allow today or yesterday to start streak
    if (i === 0 && (d === todayStr() || d === new Date(Date.now() - 86400000).toISOString().split('T')[0])) {
      streak = 1;
      checkDate = new Date(d + 'T12:00:00');
    } else if (i > 0) {
      var prevDate = new Date(uniqueDates[i - 1] + 'T12:00:00');
      var currDate = new Date(d + 'T12:00:00');
      var dayDiff = Math.round((prevDate - currDate) / 86400000);
      if (dayDiff === 1) {
        streak++;
      } else {
        break;
      }
    }
  }
  s.streak = streak;
  if (merged.length > 0) s.lastRunDate = merged[0].date || s.lastRunDate;
  s.stravaSync = Date.now();
  store(K.RUNS, s);
  return s;
}

      km: run ? run.distKm : 0,
      type: run ? run.type : 'rest',
      note: entry.note || null

  }
  var todayLog = log[todayStr()] || {};
  return {
    days: days,
    todaySleep: todayLog.sleep || null,
    todayMeal: todayLog.meal || null

var PACER_BRAIN_KEY = 'pacer_brain';
function loadBrain() {
  var def = { entries: [], stats: { total_calls:0, cache_hits:0, saved_tokens:0 } };
  return load(PACER_BRAIN_KEY, def);
}
function saveBrain(brain) {
  store(PACER_BRAIN_KEY, brain);
}
function classifyIntent(system, user) {
  var s = (system+' '+user).toLowerCase();
  if(s.includes('weather')||s.includes('aqi')||s.includes('heat')) return 'weather';
  if(s.includes('food')||s.includes('eat')||s.includes('meal')||s.includes('fuel')) return 'food';
  if(s.includes('recovery')||s.includes('rest')||s.includes('sleep')) return 'recovery';
  if(s.includes('pace')||s.includes('tempo')||s.includes('interval')||s.includes('speed')) return 'pace';
  if(s.includes('train')||s.includes('plan')||s.includes('week')||s.includes('session')) return 'training';
  return 'general';
}
function extractContext(user) {
  var ctx = {};
  var cityMatch = user.match(/City:\s*(\w+)/i);
  if(cityMatch) ctx.city = cityMatch[1];
  var runnerMatch = user.match(/runner[_ ]type[:\s]+(\w+)/i);
  if(runnerMatch) ctx.runnerType = runnerMatch[1];
  var weekMatch = user.match(/(\d+)\s*km[\s/]*(week|wk)/i);
  if(weekMatch) ctx.weeklyKm = weekMatch[1];
  var condMatch = user.match(/(GO RUN|GO EASY|WAIT|REST)/);
  if(condMatch) ctx.verdict = condMatch[1];
  return ctx;
}

// Simple similarity: how many context keys match
function contextMatch(ctx1, ctx2){
  if(!ctx1||!ctx2) return 0;
  var keys = Object.keys(ctx1);
  if(!keys.length) return 0;
  var matches = keys.filter(function(k){ return ctx1[k]===ctx2[k]; }).length;
  return matches/keys.length;
}

// Look for a cached answer - only serve if high confidence + matching context
function findCachedAnswer(system, user, intent, ctx){
  // Don't cache very short or vague questions - they lack context for reliable matching
  if(user.trim().length < 20) return null;
  var brain = loadBrain();
  var candidates = brain.entries.filter(function(e){
    return e.intent===intent && e.confidence>=0.7;
  });
  if(!candidates.length) return null;
  // Find best context match
  var best = null;
  var bestScore = 0;
  candidates.forEach(function(e){
    var score = contextMatch(ctx, e.context);
    if(score > bestScore){ bestScore=score; best=e; }
  });
  // Only serve if context matches at least 60%
  if(best && bestScore >= 0.6){
    return best;
  }
  return null;
}

// Log a new interaction
function logInteraction(system, user, answer, intent, ctx, fromCache){
  var brain = loadBrain();
  var entry = {
    id: Date.now()+'-'+Math.random().toString(36).substr(2,6),
    ts: Date.now(),
    date: new Date().toISOString().split('T')[0],
    intent: intent,
    context: ctx,
    // Store compressed versions (first 120 chars) to save space
    question_snippet: user.substring(0,120),
    answer: answer,
    answer_length: answer.length,
    from_cache: fromCache,
    confidence: fromCache ? (findCachedAnswer(system,user,intent,ctx)||{confidence:0.7}).confidence : 0.5,
    outcome: null,       // filled in later by post-run check-in
    used_count: 1,
    last_used: Date.now()
  };

  if(!fromCache){
    // Check if very similar entry exists - update instead of duplicate
    var existing = brain.entries.find(function(e){
      return e.intent===intent && contextMatch(ctx,e.context)>0.8 &&
        e.answer.substring(0,50)===answer.substring(0,50);
    });
    if(existing){
      existing.used_count++;
      existing.last_used=Date.now();
    } else {
      brain.entries.push(entry);
      // Keep last 500 entries (rotate out oldest low-confidence ones)
      if(brain.entries.length>500){
        brain.entries.sort(function(a,b){
          var scoreA = a.confidence * Math.log(a.used_count+1);
          var scoreB = b.confidence * Math.log(b.used_count+1);
          return scoreB-scoreA;
        });
        brain.entries = brain.entries.slice(0,400);
      }
    }
    brain.stats.total_calls++;
  } else {
    brain.stats.cache_hits++;
    brain.stats.saved_tokens += 200; // avg tokens per call
    // Update existing entry
    var cached = brain.entries.find(function(e){return e.id===entry.id;});
    if(cached){ cached.used_count++; cached.last_used=Date.now(); }
  }

  saveBrain(brain);
  return entry;
}

// Called from post-run check-in to update confidence on recent interactions
function updateBrainOutcome(outcome, runDate){
  var brain = loadBrain();
  var today = runDate || new Date().toISOString().split('T')[0];
  var recent = brain.entries.filter(function(e){
    return e.date===today && e.outcome===null;
  });
  recent.forEach(function(e){
    e.outcome = outcome;
    // Positive outcome boosts confidence, negative decreases it
    var delta = (outcome==='great'||outcome==='good') ? 0.08 :
                (outcome==='okay') ? 0.02 :
                (outcome==='tough') ? -0.05 : 0;
    e.confidence = Math.max(0.2, Math.min(0.98, (e.confidence||0.5)+delta));
  });
  saveBrain(brain);
}

// Get brain stats for display
function getBrainStats(){
  var b = loadBrain();
  var hitRate = b.stats.total_calls>0 ?
    Math.round(b.stats.cache_hits/(b.stats.total_calls+b.stats.cache_hits)*100) : 0;
  return {
    entries: b.entries.length,
    total_calls: b.stats.total_calls,
    cache_hits: b.stats.cache_hits,
    hit_rate: hitRate+'%',
    saved_tokens: b.stats.saved_tokens,
    high_confidence: b.entries.filter(function(e){return e.confidence>=0.8;}).length
  };
}

// -- VDOT ENGINE (Daniels & Gilbert 1979) ----------------------

function calculateVDOT(distMeters, timeMinutes) {
  if(!distMeters||!timeMinutes||timeMinutes<=0) return null;
  var V = distMeters / timeMinutes;
  var numerator = -4.60 + 0.182258*V + 0.000104*V*V;
  var denominator = 0.8 + 0.1894393*Math.exp(-0.012778*timeMinutes) + 0.2989558*Math.exp(-0.1932605*timeMinutes);
  if(denominator<=0) return null;
  return Math.round((numerator/denominator)*10)/10;
}

function estimateCurrentVDOT(recentRuns) {
  if(!recentRuns||!recentRuns.length) return null;
  var eightWeeksAgo = Date.now() - 56*24*60*60*1000;
  var candidates = recentRuns
    .filter(function(r){ return new Date(r.date).getTime()>eightWeeksAgo && (r.distKm||0)>=2 && r.durationMins; })
    .map(function(r){ return {vdot:calculateVDOT((r.distKm||r.dist_km||0)*1000, r.durationMins||r.duration_mins||0), date:r.date}; })
    .filter(function(x){ return x.vdot&&x.vdot>10; })
    .sort(function(a,b){ return b.vdot-a.vdot; });
  return candidates.length ? candidates[0].vdot : null;
}

function getTrainingPaces(vdot) {
  // Jack Daniels Running Formula zone tables (seconds/km)
  var table = {
    25:{E:570,M:510,T:482,I:450,R:420},
    30:{E:490,M:440,T:415,I:385,R:360},
    35:{E:440,M:395,T:372,I:345,R:318},
    40:{E:400,M:360,T:340,I:313,R:288},
    45:{E:368,M:332,T:312,I:287,R:263},
    50:{E:342,M:308,T:288,I:265,R:242},
    55:{E:318,M:285,T:267,I:245,R:223},
    60:{E:298,M:265,T:248,I:227,R:207},
    65:{E:280,M:248,T:232,I:212,R:193},
    70:{E:264,M:234,T:218,I:200,R:182}
  };
  var v = Math.max(25, Math.min(70, vdot||40));
  var low = Math.floor(v/5)*5;
  var high = Math.min(70, low+5);
  var frac = (v-low)/5;
  var lo = table[low]||table[25];
  var hi = table[high]||lo;
  return {
    E: Math.round(lo.E+(hi.E-lo.E)*frac),
    M: Math.round(lo.M+(hi.M-lo.M)*frac),
    T: Math.round(lo.T+(hi.T-lo.T)*frac),
    I: Math.round(lo.I+(hi.I-lo.I)*frac),
    R: Math.round(lo.R+(hi.R-lo.R)*frac)
  };
}

function fmtPaceSec(sec) {
  if(!sec||sec<=0) return '--:--';
  var m=Math.floor(sec/60), s=Math.round(sec%60);
  return m+':'+(s<10?'0':'')+s+'/km';
}

function adjustPaceForConditions(baseSec, heatIdx, aqi) {
  var hPen = thermalCalc(heatIdx||28, 60);
  var aqiPen = (aqi||80)>150?10:(aqi||80)>100?5:0;
  return Math.round(baseSec + hPen + aqiPen);
}

// -- FEASIBILITY CHECK ------------------------------------------

function assessGoalFeasibility(currentVDOT, targetPaceSec, targetKm, weeks, tier) {
  if(!currentVDOT||!targetPaceSec||!targetKm||!weeks) return {feasible:true,verdict:'unknown'};
  var targetTime = (targetPaceSec*targetKm)/60;
  var targetVDOT = calculateVDOT(targetKm*1000, targetTime);
  if(!targetVDOT) return {feasible:true,verdict:'unknown'};
  var gap = targetVDOT - currentVDOT;
  var gainPer8 = tier==='tier_1'?1.5:tier==='tier_3'?0.4:0.8;
  var projGain = (weeks/8)*gainPer8;
  if(gap<=0) return {feasible:true,verdict:'already_there',note:'You are already at this fitness level. The plan will prepare you to race it well.'};
  if(gap<=projGain*0.85) return {feasible:true,verdict:'achievable',currentVDOT:currentVDOT,targetVDOT:Math.round(targetVDOT*10)/10};
  if(gap<=projGain*1.2) return {feasible:true,verdict:'stretch',note:'This is a stretch goal -- achievable with very consistent training and no setbacks.',currentVDOT:currentVDOT,targetVDOT:Math.round(targetVDOT*10)/10};
  var achievableVDOT = Math.round((currentVDOT+projGain)*10)/10;
  var achievablePaces = getTrainingPaces(achievableVDOT);
  var weeksNeeded = Math.ceil(gap/gainPer8*8);
  return {
    feasible:false, verdict:'not_in_timeframe',
    currentVDOT:currentVDOT, targetVDOT:Math.round(targetVDOT*10)/10,
    achievableVDOT:achievableVDOT, achievablePace:fmtPaceSec(achievablePaces.T),
    weeksNeeded:weeksNeeded,
    note:'This goal needs roughly '+weeksNeeded+' weeks from your current fitness. In '+weeks+' weeks a realistic target is around '+fmtPaceSec(achievablePaces.T)+' pace.'
  };
}

// -- PHASE CALCULATOR ------------------------------------------

function getPhaseDurations(totalWeeks) {
  if(totalWeeks<=4)  return {base:1,build:2,peak:1,taper:0};
  if(totalWeeks<=8)  return {base:2,build:3,peak:2,taper:1};
  if(totalWeeks<=12) return {base:4,build:4,peak:3,taper:1};
  if(totalWeeks<=16) return {base:5,build:6,peak:4,taper:1};
  return                    {base:8,build:7,peak:4,taper:1};
}

function getPhase(weekNum, phases) {
  if(weekNum<=phases.base) return 'BASE';
  if(weekNum<=phases.base+phases.build) return 'BUILD';
  if(weekNum<=phases.base+phases.build+phases.peak) return 'PEAK';
  return 'TAPER';
}

function getPhaseDesc(phase) {
  return {BASE:'Building your aerobic engine',BUILD:'Introducing quality work',PEAK:'Sharpening race fitness',TAPER:'Freshening up for race day'}[phase]||'Building fitness';
}

function getQualityType(phase, goalType) {
  if(phase==='BUILD') return 'tempo';
  if(phase==='PEAK') return (goalType==='fitness_test'||goalType==='structured_rounds')?'intervals':'progression';
  return 'easy';
}

// -- NEW buildPlanStructure (replaces old one) ------------------


function buildPlanStructure(runnerType, goalKm, forecast, recentRuns, todayIdx, params) {
  var p = params||{};
  var vdot = p.vdot || estimateCurrentVDOT(recentRuns) || 35;
  var paces = getTrainingPaces(vdot);
  var weekNum = p.weekNumber||1;
  var totalWeeks = p.totalWeeks||8;
  var phases = getPhaseDurations(totalWeeks);
  var phase = getPhase(weekNum, phases);
  var goalType = p.goalObj&&p.goalObj.goal_type||'general';
  var tier = getUserTier(runnerType);
  var wd = getStaticWeather('Bengaluru');
  var hi2 = p.heatIndex||hiCalc(wd.temp,wd.humidity);
  var aqi2 = p.aqi||wd.aqi||80;

  // Goal-based weekly volume minimums
  var goalMin = (goalType==='race'||goalType==='marathon'||goalKm>=40)?28:
                goalType==='half'?22:
                (goalType==='5k'||goalType==='pace'||goalType==='fitness_test')?18:
                (tier==='tier_1'||runnerType==='beginner')?12:15;
  var weeklyKm = loadRuns().weeklyKm||0;
  if(!weeklyKm) weeklyKm = goalMin;

  // Every 4th week = deload
  var isRecoveryWeek = weekNum%4===0;
  var targetKm = isRecoveryWeek ? Math.round(weeklyKm*0.72) : Math.round(weeklyKm*1.08);
  if(phase==='TAPER') {
    var taperW = weekNum-(phases.base+phases.build+phases.peak);
    targetKm = Math.round(weeklyKm*(1-taperW*0.22));
  }
  targetKm = Math.max(goalMin, Math.min(80, targetKm));

  // Adjust paces for conditions
  var adjE = adjustPaceForConditions(paces.E, hi2, aqi2);
  var adjT = adjustPaceForConditions(paces.T, hi2, aqi2);
  var adjI = adjustPaceForConditions(paces.I, hi2, aqi2);

  // Max running days by tier
  var maxRunDays = tier==='tier_1'?3:tier==='tier_2'?4:5;

  // Align forecast to day names
  var DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var forecastByDay={};
  if(forecast) forecast.forEach(function(f){ forecastByDay[f.day]=f.verdict||'GO RUN'; });
  var badDays=DAYS.map(function(day,i){
    var v=forecastByDay[day]||'GO RUN';
    return (v==='WAIT'||v==='REST')?i:-1;
  }).filter(function(i){ return i>=0; });

  // STEP 1: Long run day (Sat=5, else Sun=6, else Fri=4)
  var longRunDay=5;
  if(badDays.includes(5)) longRunDay=6;
  if(badDays.includes(5)&&badDays.includes(6)) longRunDay=4;
  var longKm=Math.round(targetKm*0.29);

  // STEP 2: Recovery jog = day after long run
  var recoveryDay=(longRunDay+1)%7;

  // STEP 3: Quality session (only in BUILD/PEAK, never BASE)
  var qualCount=0;
  if(phase==='BUILD') qualCount=targetKm>=25?1:0;
  else if(phase==='PEAK') qualCount=targetKm>=28?2:1;
  else if(phase==='TAPER') qualCount=1;
  if(tier==='tier_1') qualCount=0; // tier_1 never gets quality
  if(isRecoveryWeek&&qualCount>1) qualCount=1;

  var qualType=phase==='PEAK'?'intervals':'tempo';
  var qualKm=qualCount>0?Math.round(targetKm*0.18/qualCount):0;

  // Pick quality days: not long/recovery, not bad AQI, >=2 days from long, >=2 from each other
  var qualDays=[];
  if(qualCount>0){
    var candidates=DAYS.map(function(_,i){ return i; }).filter(function(i){
      return !badDays.includes(i)&&i!==longRunDay&&i!==recoveryDay&&
             Math.abs(i-longRunDay)>=2&&Math.abs(i-recoveryDay)>=1;
    });
    candidates.forEach(function(d){
      if(qualDays.length>=qualCount) return;
      var tooClose=qualDays.some(function(q){ return Math.abs(q-d)<2; });
      if(!tooClose) qualDays.push(d);
    });
  }

  // STEP 4: Fill easy runs up to maxRunDays
  var assignedDays=[longRunDay,recoveryDay].concat(qualDays);
  var easyRunDays=[];
  var easyKm=Math.max(5,Math.round((targetKm-longKm-Math.round(longKm*0.4)-qualKm*qualDays.length)/Math.max(1,maxRunDays-assignedDays.length)));
  
  // Rotating easy run names by phase
  var easyNames={
    BASE:['Aerobic base run','Foundation run'],
    BUILD:['Easy run with strides','Easy aerobic','Easy aerobic'],
    PEAK:['Easy shakeout','Easy aerobic'],
    TAPER:['Easy shakeout','Easy aerobic']
  };
  var namePool=easyNames[phase]||easyNames.BASE;
  var easyNameIdx=0;

  var allRunCandidates=DAYS.map(function(_,i){return i;}).filter(function(i){
    return !assignedDays.includes(i)&&!badDays.includes(i);
  });

  allRunCandidates.forEach(function(d){
    if(assignedDays.length>=maxRunDays) return;
    assignedDays.push(d);
    easyRunDays.push(d);
  });

  // STEP 5: Check for 3+ consecutive running days and break them up
  var runSet=new Set(assignedDays);
  DAYS.forEach(function(_,i){
    var prev=(i-1+7)%7, next=(i+1)%7;
    if(runSet.has(i)&&runSet.has(prev)&&runSet.has(next)){
      // i is the middle of 3 consecutive   convert to rest unless it's long/quality
      if(!qualDays.includes(i)&&i!==longRunDay&&i!==recoveryDay){
        runSet.delete(i);
        easyRunDays=easyRunDays.filter(function(d){ return d!==i; });
      }
    }
  });

  // Build schedule
  var schedule={};
  DAYS.forEach(function(day,i){
    if(i===longRunDay){
      schedule[day]={type:'long',name:'Long run',km:phase==='TAPER'?Math.round(longKm*0.7):longKm,zone:'E',pace:adjE,pacePlain:fmtPaceSec(adjE)};
    } else if(i===recoveryDay&&runSet.has(i)){
      var recKm=Math.max(4,Math.round(longKm*0.4));
      schedule[day]={type:'recovery',name:'Recovery jog',km:recKm,zone:'E',pace:adjE+60,pacePlain:fmtPaceSec(adjE+60)};
    } else if(qualDays.includes(i)){
      var qLabel=qualType==='tempo'?'Tempo run':'Intervals';
      var qz=qualType==='intervals'?'I':'T';
      var qPace=qualType==='intervals'?adjI:adjT;
      // Deload: cut km by 40% on recovery week
      var qKmFinal=isRecoveryWeek?Math.round(qualKm*0.6):qualKm;
      schedule[day]={type:qualType,name:qLabel,km:qKmFinal,zone:qz,pace:qPace,pacePlain:fmtPaceSec(qPace)};
    } else if(runSet.has(i)&&easyRunDays.includes(i)){
      var eName=namePool[easyNameIdx%namePool.length]; easyNameIdx++;
      schedule[day]={type:'easy',name:eName,km:easyKm,zone:'E',pace:adjE,pacePlain:fmtPaceSec(adjE)};
    } else {
      schedule[day]={type:'rest',name:'Rest day',km:0};
    }
  });

  // Guarantee minimum 2 rest days
  var restCount=DAYS.filter(function(d){ return schedule[d].type==='rest'; }).length;
  if(restCount<2){
    // Convert easiest easy run to rest (prefer mid-week non-adjacent to quality)
    var extras=easyRunDays.filter(function(d){
      return !qualDays.includes(d)&&d!==longRunDay&&d!==recoveryDay;
    });
    if(extras.length>0){
      var makeRest=extras[Math.floor(extras.length/2)];
      schedule[DAYS[makeRest]]={type:'rest',name:'Rest day',km:0};
    }
  }

  return {
    phase:phase, weekNumber:weekNum, totalWeeks:totalWeeks,
    targetWeeklyKm:targetKm, isRecoveryWeek:isRecoveryWeek,
    qualitySessions:qualCount, schedule:schedule,
    paces:paces, vdot:vdot,
    heatPenalty:thermalCalc(hi2,60), aqi:aqi2,
    phaseDesc:getPhaseDesc(phase)
  };
}

// Call after buildPlanStructure. Adjusts today's and future sessions
// based on actual forecast. Returns { schedule, swapNotes }.
function applyWeatherToSchedule(schedule, forecast, city) {
  if(!schedule||!forecast||!forecast.length) return {schedule:schedule, swapNotes:[]};

  var DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var today=new Date().getDay(); // 0=Sun
  // Convert JS getDay (0=Sun) to Mon-indexed (0=Mon)
  var todayIdx=(today===0)?6:(today-1);
  var todayName=DAYS[todayIdx];
  var todaySess=schedule[todayName];
  if(!todaySess) return {schedule:schedule, swapNotes:[]};

  var swapNotes=[];
  var sched=Object.assign({},schedule);
  DAYS.forEach(function(d){ sched[d]=Object.assign({},schedule[d]); });

  // Build forecast lookup by day name
  var fcByDay={};
  forecast.forEach(function(f){ fcByDay[f.day]={verdict:f.verdict||'GO RUN',hi:f.heatIdx||f.heatIndex||30,aqi:f.aqi||80}; });

  var todayFc=fcByDay[todayName]||{verdict:'GO RUN',hi:30,aqi:80};

  // RULE A: Quality session on bad AQI day
  if((todaySess.type==='tempo'||todaySess.type==='intervals')&&
     (todayFc.verdict==='WAIT'||todayFc.verdict==='REST')){
    // Find earliest future day with good conditions and easy/rest session
    var swapDay=null;
    for(var k=1;k<=6;k++){
      var futureIdx=(todayIdx+k)%7;
      var futureName=DAYS[futureIdx];
      var futureFc=fcByDay[futureName]||{verdict:'GO RUN'};
      var futureSess=sched[futureName];
      if((futureFc.verdict==='GO RUN'||futureFc.verdict==='GO EASY')&&
         futureSess&&(futureSess.type==='easy'||futureSess.type==='rest')){
        swapDay=futureName; break;
      }
    }
    if(swapDay){
      var qualSess=Object.assign({},todaySess);
      sched[swapDay]=qualSess;
      sched[todayName]={type:'easy',name:'Easy aerobic',km:sched[todayName].km||6,zone:'E',
        pace:sched[todayName].pace,pacePlain:sched[todayName].pacePlain};
      swapNotes.push(todaySess.name+' moved to '+swapDay+' -- AQI '+todayFc.aqi+
        ' and heat index '+todayFc.hi+'C today. '+swapDay+"'s forecast looks better.");
    }
  }

  // RULE B: Long run on dangerously hot day
  var todaySess2=sched[todayName];
  if(todaySess2.type==='long'&&todayFc.hi>38){
    var swapDayB=null;
    for(var j=1;j<=6;j++){
      var fidx=(todayIdx+j)%7;
      var fname=DAYS[fidx];
      var ffc=fcByDay[fname]||{verdict:'GO RUN',hi:30};
      var fs=sched[fname];
      if((ffc.verdict==='GO RUN'||ffc.verdict==='GO EASY')&&fs&&
         (fs.type==='easy'||fs.type==='rest'||fs.type==='recovery')){
        swapDayB=fname; break;
      }
    }
    if(swapDayB){
      sched[swapDayB]=Object.assign({},todaySess2);
      sched[todayName]={type:'rest',name:'Rest day',km:0};
      swapNotes.push('Long run moved to '+swapDayB+' -- heat index '+todayFc.hi+
        'C makes long efforts unsafe today. Extra heat stress accumulates over distance.');
    }
  }

  // RULE C: Yesterday was WAIT/REST conditions -- override today to recovery
  var yestIdx=(todayIdx-1+7)%7;
  var yestName=DAYS[yestIdx];
  var yestFc=fcByDay[yestName]||{verdict:'GO RUN'};
  var yestLog=loadLog()[todayStr()]; // check if yesterday had a logged run in bad conditions
  var todayLog=loadLog();
  var yesterday=new Date(Date.now()-86400000).toISOString().split('T')[0];
  var yestEntry=todayLog[yesterday]||{};
  if((yestFc.verdict==='WAIT'||yestFc.verdict==='REST')&&yestEntry.feel){
    var curr=sched[todayName];
    if(curr&&curr.type!=='rest'&&curr.type!=='recovery'){
      var recKm=Math.max(4,Math.round((curr.km||6)*0.5));
      sched[todayName]={type:'recovery',name:'Recovery jog',km:recKm,zone:'E',
        pace:(curr.pace||360)+30,pacePlain:fmtPaceSec((curr.pace||360)+30)};
      swapNotes.push("Recovery day -- yesterday's conditions were very demanding. Your body needs 48 hours not 24.");
    }
  }

  // RULE D: No good days all week
  var goodDays=forecast.filter(function(f){
    return f.verdict==='GO RUN'||f.verdict==='GO EASY';
  });
  if(goodDays.length===0){
    DAYS.forEach(function(day){
      var s=sched[day];
      if(s&&(s.type==='tempo'||s.type==='intervals')&&s.km>0){
        sched[day]=Object.assign({},s,{km:Math.max(3,Math.round(s.km*0.6))});
        if(!swapNotes.some(function(n){ return n.indexOf('shortened')>-1; })){
          swapNotes.push('Tough week conditions across all days. Quality session shortened by 40%. Consistency this week matters more than hitting full targets.');
        }
      }
    });
  }

  return {schedule:sched, swapNotes:swapNotes};
}

// -- VDOT UPDATE FROM NEW RUNS ----------------------------------

function checkAndUpdateVDOT(newRun, currentVDOT) {
  if(!newRun||(newRun.distKm||0)<3||!newRun.durationMins) return null;
  if(newRun.feel&&newRun.feel!=='strong'&&newRun.feel!=='good') return null;
  var newV = calculateVDOT(newRun.distKm*1000, newRun.durationMins);
  if(!newV||!currentVDOT||newV<=currentVDOT+0.5) return null;
  var newPaces = getTrainingPaces(newV);
  return {
    previousVDOT:currentVDOT,
    newVDOT:Math.round(newV*10)/10,
    newPaces:newPaces,
    message:'Your fitness has improved. Easy pace is now '+fmtPaceSec(newPaces.E)+'.'
  };
}

// -- WEEKLY ADAPTATION ------------------------------------------

function adaptPlanForNextWeek(completedSessions, perceivedEfforts, missedCount) {
  var toughCount = (perceivedEfforts||[]).filter(function(e){ return e==='tough'||e==='Tough'; }).length;
  if(toughCount>=2) return {factor:0.90,note:'Two sessions felt tough -- building in extra recovery.'};
  if((missedCount||0)>=3) return {factor:0.85,note:'Resuming after a break -- rebuilding gradually. Never chase missed sessions.'};
  var allStrong = perceivedEfforts&&perceivedEfforts.length>0&&perceivedEfforts.every(function(e){ return e==='strong'||e==='Strong'; });
  if(allStrong) return {factor:1.10,note:'Strong week -- fitness is building well.'};
  return {factor:1.08,note:null};
}

// --- RUN HISTORY ANALYSIS ---
var RUN_ANALYSIS_KEY = 'p_run_analysis';
function analyzeAndCacheRunHistory(runs) {
  if (!runs || runs.length < 2) return;
  var analysis = {};

  // Volume trend (last 4 weeks)
  var weeks = {};
  runs.forEach(function (r) {
    if (!r.date) return;
    var d = new Date(r.date + 'T12:00:00');
    var mon = new Date(d);
    mon.setDate(d.getDate() - d.getDay() + 1);
    var wk = mon.toISOString().split('T')[0];
    if (!weeks[wk]) weeks[wk] = {
      km: 0,
      runs: 0,
      paces: []
    };
    weeks[wk].km = Math.round((weeks[wk].km + (r.distKm || 0)) * 10) / 10;
    weeks[wk].runs++;
    if (r.paceNum) weeks[wk].paces.push(r.paceNum);
  });
  var wkKeys = Object.keys(weeks).sort().slice(-4);
  analysis.weeklyKms = wkKeys.map(function (k) {
    return {
      week: k,
      km: weeks[k].km,
      runs: weeks[k].runs
    };
  });
  analysis.avgWeeklyKm = analysis.weeklyKms.length > 0 ? Math.round(analysis.weeklyKms.reduce(function (s, w) {
    return s + w.km;
  }, 0) / analysis.weeklyKms.length * 10) / 10 : 0;

  // Pace trend
  var pacedRuns = runs.filter(function (r) {
    return r.paceNum && r.paceNum > 0;
  }).slice(0, 10);
  if (pacedRuns.length >= 2) {
    analysis.avgPaceSec = Math.round(pacedRuns.reduce(function (s, r) {
      return s + r.paceNum;
    }, 0) / pacedRuns.length);
    var recent5 = pacedRuns.slice(0, 5),
      older5 = pacedRuns.slice(5);
    if (older5.length >= 2) {
      var recentAvg = recent5.reduce(function (s, r) {
        return s + r.paceNum;
      }, 0) / recent5.length;
      var olderAvg = older5.reduce(function (s, r) {
        return s + r.paceNum;
      }, 0) / older5.length;
      analysis.paceTrend = recentAvg < olderAvg ? 'improving' : recentAvg > olderAvg + 10 ? 'slower' : 'steady';
    }
  }

  // Consistency
  analysis.totalRuns = runs.length;
  analysis.avgDistKm = Math.round(runs.reduce(function (s, r) {
    return s + (r.distKm || 0);
  }, 0) / runs.length * 10) / 10;

  // Longest run
  var longest = runs.reduce(function (a, b) {
    return (b.distKm || 0) > (a.distKm || 0) ? b : a;
  }, {
    distKm: 0
  });
  analysis.longestKm = longest.distKm;
  analysis.longestDate = longest.date;

  // Feel patterns
  var feelCounts = {
    great: 0,
    good: 0,
    okay: 0,
    tough: 0
  };
  runs.forEach(function (r) {
    if (r.feel && feelCounts[r.feel] !== undefined) feelCounts[r.feel]++;
  });
  analysis.feelCounts = feelCounts;

  // HR data if available
  var hRuns = runs.filter(function (r) {
    return r.heartRate && r.heartRate > 100;
  });
  if (hRuns.length > 2) {
    analysis.avgHR = Math.round(hRuns.reduce(function (s, r) {
      return s + r.heartRate;
    }, 0) / hRuns.length);
  }
  analysis.generatedAt = Date.now();
  analysis.sampleSize = runs.length;
  store(RUN_ANALYSIS_KEY, analysis);
  return analysis;
}
function loadRunAnalysis() {
  return load(RUN_ANALYSIS_KEY, null);
}
function formatAnalysisForPrompt(analysis) {
  if (!analysis) return '';
  var lines = ['Run history analysis (' + analysis.sampleSize + ' runs from Strava):', '- Avg weekly km: ' + analysis.avgWeeklyKm + 'km', '- Total runs analysed: ' + analysis.totalRuns, '- Avg run distance: ' + analysis.avgDistKm + 'km', '- Longest run: ' + analysis.longestKm + 'km' + (analysis.longestDate ? ' on ' + analysis.longestDate : ''), analysis.avgPaceSec ? '- Average pace: ' + Math.floor(analysis.avgPaceSec / 60) + ':' + String(analysis.avgPaceSec % 60).padStart(2, '0') + '/km' : '', analysis.paceTrend ? '- Pace trend: ' + analysis.paceTrend : '', analysis.avgHR ? '- Average heart rate: ' + analysis.avgHR + 'bpm' : '', analysis.weeklyKms && analysis.weeklyKms.length > 1 ? '- Recent weeks: ' + analysis.weeklyKms.map(function (w) {
    return w.km + 'km';
  }).join(', ') : ''];
  return lines.filter(Boolean).join('\n');
}

function getTomorrowSession(planType){
  var aiPlan=loadAIPlan();
  if(aiPlan&&aiPlan.plan&&aiPlan.plan.length>1){
    var tomorrowDay=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][(new Date().getDay()+1)%7];
    var found=aiPlan.plan.find(function(s){return s.day===tomorrowDay;});
    if(found)return found;
  }
  // Fallback: get tomorrow from template plan
  var plan=PLANS[planType]||PLANS.general;
  var tIdx=(new Date().getDay()+1)%plan.sessions.length;
  var tmrSess=plan.sessions[tIdx];
  return tmrSess?{name:tmrSess[1],km:tmrSess[2],type:tmrSess[0]}:null;
}

// One brain. All cards read from this.

function getRunWindows(wd){
  if(!wd)wd={};
  // Real-time window calculator with estimated temps at each time
  // Based on Indian summer patterns: peak heat 12-3pm, night cools 5-8C from peak
  var baseTemp=wd.temp||36;
  var aqi=wd.aqi||80;
  var hum=wd.humidity||60;

  // Temp offsets from current (rough model: -8 at 6am, -4 at 7am, peak at 1pm, -6 at 9pm, -8 at 11pm)
  function estHI(tOff){ return hiCalc(Math.round(baseTemp+tOff), hum); }

  var windows=[
    {id:'early_morning', label:'Early morning', range:'5:30-7:30 AM', start:5.5, end:7.5,
     hi:estHI(-8), verdict:getVerdict(aqi, estHI(-8)).v,
     tip:'Coolest window of the day. Low traffic. Best air quality.'},
    {id:'morning', label:'Morning', range:'7:30-9:00 AM', start:7.5, end:9,
     hi:estHI(-5), verdict:getVerdict(aqi, estHI(-5)).v,
     tip:'Getting warmer. Doable but go earlier if you can.'},
    {id:'evening', label:'Evening', range:'6:00-8:30 PM', start:18, end:20.5,
     hi:estHI(-4), verdict:getVerdict(aqi, estHI(-4)).v,
     tip:'Sun is down. Second best window. Popular with runners.'},
    {id:'night', label:'Night', range:'9:00-11:00 PM', start:21, end:23,
     hi:estHI(-6), verdict:getVerdict(aqi, estHI(-6)).v,
     tip:'Late night running is common in Indian summer. Cooler than evening. Stick to well-lit roads.'},
    {id:'late_night', label:'Late night', range:'11:00 PM-12:30 AM', start:23, end:24.5,
     hi:estHI(-8), verdict:getVerdict(aqi, estHI(-8)).v,
     tip:'Actually one of the coolest times. Temperature drops close to early morning levels. Only if area is safe.'}
  ];

  return windows.map(function(w){
    // Color code
    var color=w.verdict==='GO RUN'?C.green:w.verdict==='GO EASY'?C.blue:C.orange;
    return Object.assign({},w,{color:color});
  });
}

function getOpenWindows(allWindows, hr){
  // Which windows are still available right now?
  return allWindows.filter(function(w){
    if(hr < w.end) return true; // not closed yet
    if(w.id==='late_night' && hr >= 23) return true; // wraps past midnight
    return false;
  });
}

function getNextWindow(allWindows, hr){
  // The best upcoming window from now
  var open=getOpenWindows(allWindows, hr);
  if(!open.length)return null;
  // Prefer the one starting soonest
  return open.reduce(function(best,w){
    if(!best)return w;
    // If this window is already started and not expired, it's NOW
    if(hr >= w.start && hr < w.end) return w;
    // Otherwise pick the one starting soonest
    return w.start < best.start ? w : best;
  }, null);
}

function getCurrentWindow(allWindows, hr){
  // Are we INSIDE a window right now?
  return allWindows.find(function(w){
    return hr >= w.start && hr < w.end;
  })||null;
}

  var isRestDay=sess[0]==='rest';
  var runDone=!!todayRun;
  var isAfterMidnight=hr>=0&&hr<4; // 12am-4am

  if(rt==='serious')return 'tier_3';
  return 'tier_2';
}

  var ht=hi<28?'cool and comfortable':hi<32?'mild and warming up':hi<36?'warm and a bit heavy':hi<40?'quite hot and demanding':'very hot -- high heat stress';
  var at=aqi<50?'air is clean':aqi<100?'air quality is good':aqi<150?'air quality is moderate':aqi<200?'air quality is poor today':'air quality is bad -- avoid outdoor exertion';
  return ht+', '+at;
}


function getSleepContext(sleepQuality) {
  var s=(sleepQuality||'').toLowerCase();
  if(s==='rough'||s==='poor')return 'Rough -- runner slept poorly. Adjust session down slightly. Acknowledge fatigue briefly without dwelling on it.';
  if(s==='ok'||s==='okay')return 'Okay -- normal sleep. No adjustment needed. Do not mention sleep unless relevant.';

  if(!totalSeconds)return '--:--';
  var mins=Math.floor(totalSeconds/60);

}

  var parts=basePaceStr.split(':');
  var base=parseInt(parts[0]||6)*60+(parseInt(parts[1])||0);
  return formatPace(base+(penaltySecs||0));

  var rt=(runnerType||'regular').toLowerCase();

function updateLogAction(action) {
  try{
    var stored=localStorage.getItem('pacer_coach_memory');
    if(!stored)return;
    var log=JSON.parse(stored);
    var today=new Date().toISOString().split('T')[0];
    for(var i=log.logs.length-1;i>=0;i--){
      if(log.logs[i].date===today&&log.logs[i].user_action===null){
        log.logs[i].user_action=action;
        break;
      }
    }
    localStorage.setItem('pacer_coach_memory',JSON.stringify(log));
  }catch(e){}
}

// CARD 1 -- COACH CARD (spec v2)
// 6 window states + RAN_TODAY + REST_DAY

function calcWindows(wd) {
  // Returns { morning, evening } each with { start, end, label, hi, verdict, penalty }
  var base = wd.temp||32, aqi = wd.aqi||80, hum = wd.humidity||60;
  function estHI(off){ return hiCalc(Math.round(base+off), hum); }
  function verd(hi){ return getVerdict(aqi, hi).v; }
  function pen(hi){ return thermalCalc(hi, hum); }

  // Morning: best stretch of 5:30-9am (use early morning if runnable, else morning)
  var mHI = estHI(-8);
  var mHI2 = estHI(-5);
  var mVerd = verd(mHI);
  var m2Verd = verd(mHI2);
  var morningRunnable = mVerd==='GO RUN'||mVerd==='GO EASY';
  var m2Runnable = m2Verd==='GO RUN'||m2Verd==='GO EASY';

  var morning = null;
  if(morningRunnable) morning = {start:5.5,end:7.5,label:'5:30-7:30am',hi:mHI,verdict:mVerd,penalty:pen(mHI)};
  else if(m2Runnable) morning = {start:7.5,end:9,label:'7:30-9am',hi:mHI2,verdict:m2Verd,penalty:pen(mHI2)};

  // Evening: 6-8:30pm
  var eHI = estHI(-4);
  var eVerd = verd(eHI);
  var eveningRunnable = eVerd==='GO RUN'||eVerd==='GO EASY';
  var evening = eveningRunnable ? {start:18,end:20.5,label:'6-8:30pm',hi:eHI,verdict:eVerd,penalty:pen(eHI)} : null;

  return {morning:morning, evening:evening};
}

function getWindowState(hr, win) {
  var m = win.morning, e = win.evening;
  if(!m && !e) return 'NO_WINDOW_TODAY';
  if(hr < (m ? m.start : 5)) return 'PRE_MORNING';
  if(m && hr >= m.start && hr <= m.end) return 'WINDOW_OPEN_MORNING';
  if(hr > (m ? m.end : 9) && hr < 16) return e ? 'MORNING_GONE_EVENING_AHEAD' : 'NO_WINDOW_TODAY';
  if(e && hr >= 14 && hr < e.start) return 'EVENING_COMING';
  if(e && hr >= e.start && hr <= e.end) return 'WINDOW_OPEN_EVENING';
  if((e && hr > e.end) || (!e && hr >= 21)) return 'ALL_WINDOWS_GONE_TODAY';
  return 'PRE_MORNING';
}

function getCard1State(todayRun, isRestDay, hr, win) {
  if(todayRun) return 'RAN_TODAY';
  if(isRestDay) return 'REST_DAY';
  return getWindowState(hr, win);
}

function fmtWin(w) {
  if(!w) return null;
  return w.label;
}

function minsUntil(targetHour) {
  var hr = new Date().getHours();
  var min = new Date().getMinutes();
  var diff = (targetHour - hr)*60 - min;
  return Math.max(0, Math.round(diff));
}

function minsRemaining(endHour) {
  var hr = new Date().getHours();
  var min = new Date().getMinutes();
  var diff = (endHour - hr)*60 - min;
  return Math.max(0, Math.round(diff));
}

function getVerdictBadge(verdict, aqi, tier) {
  var VCOLS = {'GO RUN':'#4ade80','GO EASY':'#A3E635','WAIT':'#FF9500','REST':'#ff4444','NO_WINDOW_TODAY':'#FF9500','RAN_TODAY':'#4ade80','REST_DAY':'#60A5FA'};
  var col = VCOLS[verdict]||'rgba(255,255,255,.3)';
  if(tier==='tier_1') return React.createElement('div',{style:{width:10,height:10,borderRadius:'50%',background:col,flexShrink:0}});
  var label = verdict==='RAN_TODAY'?'DONE':verdict==='REST_DAY'?'REST DAY':verdict||'--';

  return React.createElement('span',{style:{fontSize:10,fontWeight:800,letterSpacing:'1px',color:col}},label);
}

  var city=props.city, planType=props.planType, runnerType=props.runnerType;

  var sess=getSession(planType);

  var therm=thermalCalc(hi,wd.humidity);
  var verd=getVerdict(wd.aqi,hi);

  var tier=getUserTier(runnerType);
  var win=calcWindows(wd);
  var cardState=getCard1State(todayRun,isRestDay,hr,win);

  var basePace=getBasePace(runnerType,sess[0]);
  var adjPace=getAdjustedPace(basePace,therm);
  var tomorrow=getTomorrowSession(planType);

  // Evening estimates
  var eHI = win.evening ? win.evening.hi : hiCalc(Math.max(26,wd.temp-4),wd.humidity);
  var eVerd = win.evening ? win.evening.verdict : getVerdict(wd.aqi,eHI).v;
  var ePen = win.evening ? win.evening.penalty : thermalCalc(eHI,wd.humidity);
  var eAdj = win.evening ? getAdjustedPace(basePace,ePen) : adjPace;

  var cacheKey=today+'-'+cardState+'-'+tier;
  var [sleep,setSleep]=React.useState(todayLog.sleep||'');
  var [feel,setFeel]=React.useState(todayRun&&todayRun.feel||'');
  var [msg,setMsg]=React.useState('');

  var [asking,setAsking]=React.useState(false);
  var [chatMode,setChatMode]=React.useState(false);
  var inputRef=React.useRef(null);

// -- Supabase client (graceful no-op when not configured) --
var _supabaseClient = null;
function getSupabase() {
  if(_supabaseClient) return _supabaseClient;
  try {
    var cfg = window.PACER_CONFIG || {};
    var url = cfg.supabaseUrl;
    var key = cfg.supabaseKey;
    if(url && key && url.indexOf('@@') === -1 && window.supabase) {
      _supabaseClient = window.supabase.createClient(url, key);
    }
  } catch(e) {}
  return _supabaseClient;
}

async function logInteractionSupa(data) {
  try {
    var sb = getSupabase();
    if(!sb) return; // not configured -- silent no-op
    await sb.from('interactions').insert({
      user_id:          data.userId||'anonymous',
      feature:          data.feature,
      input_context:    data.inputContext||{},
      user_message:     data.userMessage||null,
      claude_response:  data.response,
      city:             data.city||null,
      user_tier:        data.userTier||null,
      verdict:          data.verdict||null,

      response_time_ms: data.responseTimeMs||null,
      was_useful:       null
    });
  } catch(err) {
    // Logging must never break the app
  }
}

function stringSimilarity(a, b) {
  if(!a||!b) return 0;
  var wa = new Set(a.split(' ').filter(function(w){return w.length>2;}));
  var wb = new Set(b.split(' ').filter(function(w){return w.length>2;}));
  var inter = [...wa].filter(function(w){return wb.has(w);});
  var union = new Set([...wa,...wb]);
  return union.size ? inter.length/union.size : 0;
}

async function checkFoodKnowledge(normalised, session, verdict) {
  try {
    var sb = getSupabase();
    if(!sb) return null;
    var res = await sb.from('food_knowledge').select('*')
      .eq('context_session', session||'')
      .gte('confidence', 60)
      .order('times_asked', {ascending:false})
      .limit(10);
    var rows = res.data;
    if(!rows||!rows.length) return null;
    return rows.find(function(r){ return stringSimilarity(r.question_normalised,normalised)>0.72; })||null;
  } catch(e){ return null; }
}

async function storeFoodKnowledge(data) {
  try {
    var sb = getSupabase();
    if(!sb) return;
    var res = await sb.from('food_knowledge').select('id,times_asked,confidence,question_normalised')
      .eq('context_session', data.context_session||'').limit(20);
    var existing = res.data||[];
    var dup = existing.find(function(r){ return stringSimilarity(r.question_normalised||'',data.question_normalised)>0.85; });
    if(dup) {
      await sb.from('food_knowledge').update({
        times_asked: dup.times_asked+1,
        confidence: Math.min(100,dup.confidence+5),
        last_used_at: new Date().toISOString()
      }).eq('id',dup.id);
    } else {
      await sb.from('food_knowledge').insert({
        question_text: data.question_text,
        question_normalised: data.question_normalised,
        context_session: data.context_session,
        context_conditions: data.context_conditions,
        context_timing: data.context_timing,
        answer_text: data.answer_text,
        times_asked: 1,
        confidence: 10
      });
    }
  } catch(e) {}
}

function getRunTimeContext(runs, scheduledHour) {
  if(scheduledHour) return {known:true, runHour:scheduledHour, source:'scheduled'};
  var hours = (runs||[]).slice(0,14).map(function(r){
    var d = new Date(r.date+'T12:00:00');
    return d.getHours();
  }).filter(function(h){ return h>3&&h<23; });
  if(hours.length>=3) {
    var avg = Math.round(hours.reduce(function(a,b){return a+b;},0)/hours.length);
    var consistent = hours.every(function(h){ return Math.abs(h-avg)<=2; });
    if(consistent) return {known:true, runHour:avg, source:'pattern'};
  }
  return {known:false, source:'unknown'};
}

function resolveFoodTimeline(runHour, sessionType, sessKm, tier) {
  var timeline = [];
  var simpleMode = tier === 'tier_1';

  if(runHour >= 5 && runHour <= 8) {
    timeline.push({type:'prerun',   label:'PRE-RUN \u00b7 NOW',         food:simpleMode?'A banana or 2 dates + water':'Banana or 2 dates + 400ml water', why:'Fast carbs, easy on the stomach before a hot run.'});
    timeline.push({type:'postrun_meal', label:'POST-RUN \u00b7 BREAKFAST', food:simpleMode?'Curd rice or dal khichdi':'Curd rice or dal khichdi (carbs + protein)', why:'Post-run and breakfast are the same meal today -- eat within 30 min of finishing.'});
    timeline.push({type:'meal',     label:'LUNCH',                    food:'Normal meal -- no adjustments needed.', why:'Run is done, body recovering well.'});
  } else if(runHour >= 9 && runHour <= 11) {
    timeline.push({type:'prerun_meal', label:'PRE-RUN \u00b7 BREAKFAST', food:simpleMode?'Idli or curd rice':'Idli, curd rice, or upma -- light', why:'Breakfast and pre-run are the same meal. Eat 60-90 min before your run.'});
    timeline.push({type:'postrun', label:'POST-RUN \u00b7 SNACK',      food:simpleMode?'Banana or chaas':'Banana or chaas with a pinch of salt', why:'Quick recovery before lunch.'});
    timeline.push({type:'meal',    label:'LUNCH',                     food:'Normal meal -- dal, rice, sabzi.', why:'Full recovery meal 60-90 min after run.'});
  } else if(runHour >= 12 && runHour <= 14) {
    timeline.push({type:'meal',    label:'BREAKFAST',                 food:'Normal breakfast.', why:'No run adjustments needed this early.'});
    timeline.push({type:'prerun',  label:'PRE-RUN \u00b7 SNACK',      food:simpleMode?'Banana or a handful of peanuts at 11am':'Light snack at 11am -- banana or roasted peanuts', why:'Top up before midday run without a full meal.'});
    timeline.push({type:'postrun_meal', label:'POST-RUN \u00b7 LUNCH', food:'Dal and rice or curd rice.', why:'Post-run and lunch are the same meal -- eat within 30 min of finishing.'});
  } else if(runHour >= 17 && runHour <= 20) {
    timeline.push({type:'meal',    label:'BREAKFAST',                 food:'Normal breakfast.', why:'No run adjustments needed.'});
    timeline.push({type:'meal',    label:'LUNCH',                     food:'Normal but not too heavy.', why:'You run in the evening -- a heavy lunch slows digestion.'});
    timeline.push({type:'prerun',  label:'PRE-RUN \u00b7 SNACK',      food:simpleMode?'Banana or peanuts at '+(runHour-2)+'pm':'Light snack at '+(runHour-2)+':00 -- banana or roasted peanuts', why:'Lunch was 3-4 hours ago. Small top-up before evening run.'});
    timeline.push({type:'postrun_meal', label:'POST-RUN \u00b7 DINNER', food:'Dal and rice or khichdi.', why:'Post-run and dinner are the same meal -- eat within 45 min.'});
  } else {
    timeline.push({type:'meal', label:'GENERAL', food:'Keep meals light, at least 90 min gap before running.', why:'Set your run time for a specific plan.'});
  }

  // During-run fuel for long runs (tier 2+ only)
  if(tier !== 'tier_1' && sessKm >= 9 && sessionType !== 'recovery') {
    timeline.splice(timeline.length-1, 0, {
      type:'during', label:'DURING RUN',
      food:'2 dates or half banana after 45 min',
      why:'Runs above 60 min need mid-run fuel. Carry in a small pocket.'
    });
  }

  return timeline;
}

function getAppState(runs, aiPlan, userPrefs, weather){
  var hr = new Date().getHours();
  var today = todayStr();
  var tomorrow = new Date(Date.now()+86400000).toISOString().split('T')[0];
  var wd = weather || getStaticWeather(userPrefs.city||'Bengaluru');
  var hi = hiCalc(wd.temp, wd.humidity);
  var therm = thermalCalc(hi, wd.humidity);
  var verd = getVerdict(wd.aqi, hi);
  var runs_ = runs||[];
  var todayRuns = runs_.filter(function(r){return r.date===today;});
  var ranToday = todayRuns.length>0;
  var todayKm = todayRuns.reduce(function(s,r){return s+(parseFloat(r.distKm)||0);},0);
  var planType = userPrefs.plan||'general';
  var sess = getSession(planType);
  var isRestDay = sess[0]==='rest';

  // Get tomorrow's session from AI plan or template
  var tomorrowSess = null;
  var todayDay = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date().getDay()];
  var tomorrowDay = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][(new Date().getDay()+1)%7];
  if(aiPlan&&aiPlan.plan){
    var tIdx = aiPlan.plan.findIndex(function(s){return s.day===tomorrowDay;});
    if(tIdx>=0) tomorrowSess = aiPlan.plan[tIdx];
  }

  // Compute best run windows for today based on AQI + time
  var forecast = getWeekForecast(userPrefs.city||'Bengaluru', 1);
  var morningAqi = wd.aqi; // use live AQI for today
  var eveningHeat = hiCalc(Math.max(wd.temp-2, wd.temp-4), wd.humidity); // approx cooler
  var morningGood = morningAqi<100 && hi<40;
  var eveningGood = wd.aqi<120; // evening AQI usually similar

  // Determine phase
  var phase;
  if(isRestDay){
    phase = 'rest_day';
  } else if(hr >= 22){
    phase = 'late_night'; // show tomorrow's plan
  } else if(ranToday && todayKm >= sess[2]*0.7){
    phase = 'run_done'; // run is complete
  } else if(hr < 10){
    phase = 'morning_pre_run';
  } else if(hr >= 10 && hr < 17){
    phase = 'midday_no_run'; // morning window closed, suggest evening
  } else {
    phase = 'evening_window'; // last chance
  }

  // Best windows calculation
  var windows = [];
  if(!ranToday && !isRestDay){
    if(morningGood) windows.push({label:'Morning window',time:'5:30 - 7:30 AM',verdict:'GO RUN'});
    if(eveningGood) windows.push({label:'Evening window',time:'7:00 - 9:00 PM',verdict:wd.aqi<100?'GO RUN':'GO EASY'});
    if(!windows.length) windows.push({label:'Treadmill or indoors',time:'Any',verdict:'WAIT outside'});
  }

  // Build the coaching message seed -- what the CoachCard should focus on
  var coachFocus;
  var coachContext = '';
  if(phase==='rest_day'){
    coachFocus = 'rest_recovery';
    coachContext = 'Today is a rest day. Focus on recovery, sleep, nutrition, and light movement only.';
  } else if(phase==='late_night'){
    coachFocus = 'tomorrow_prep';
    var tSess = tomorrowSess;
    coachContext = 'It is after 10 PM. Brief on tomorrow: '+(tSess?tSess.name+' '+tSess.km+'km ('+tSess.type+') - '+tSess.why:'check the plan for tomorrow.');
  } else if(phase==='run_done'){
    coachFocus = 'post_run_recovery';
    coachContext = 'Runner completed '+Math.round(todayKm*10)/10+'km today. Focus on recovery advice: nutrition, hydration, tomorrow plan. The hard work is done.';
  } else if(phase==='morning_pre_run'){
    coachFocus = 'morning_brief';
    coachContext = 'Morning brief. Session today: '+sess[1]+' '+sess[2]+'km. Best window is now (before heat builds). Conditions: '+verd.v+', heat index '+hi+'C.';
    if(windows.length>1) coachContext += ' Two windows available today: '+windows.map(function(w){return w.label+' ('+w.time+')';}).join(' and ')+'.';
  } else if(phase==='midday_no_run'){
    coachFocus = 'midday_redirect';
    coachContext = 'It is '+hr+':00 and the morning window has passed. Heat index '+hi+'C makes midday running a bad idea. Redirect to evening window (7-9 PM). Encourage them to save energy and hydrate.';
  } else if(phase==='evening_window'){
    coachFocus = 'evening_push';
    coachContext = 'Evening window now. Heat dropping slightly. AQI '+wd.aqi+'. Session: '+sess[1]+' '+sess[2]+'km. This is the last opportunity today.';
  }

  return {
    phase: phase,
    ranToday: ranToday,
    todayKm: todayKm,
    isRestDay: isRestDay,
    sess: sess,
    tomorrowSess: tomorrowSess,
    wd: wd,
    hi: hi,
    therm: therm,
    verd: verd,
    windows: windows,
    coachFocus: coachFocus,
    coachContext: coachContext,
    hr: hr,
    today: today
  };
}
