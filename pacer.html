var K = {

function store(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
  } catch (e) {}
}
function load(key, def) {
  try {
    var v = localStorage.getItem(key);
    return v ? JSON.parse(v) : def;
  } catch (e) {
    return def;
  }
}
function gk(k) {
  try {
    return localStorage.getItem(k) || '';

function sk(k, v) {
  try {
    localStorage.setItem(k, v);

}
function getWeekStart() {
  var d = new Date(),
    day = d.getDay(),
    diff = d.getDate() - day + (day === 0 ? -6 : 1);
  return new Date(new Date(d).setDate(diff)).toISOString().split('T')[0];
}
function loadRuns() {
  var data = load(K.RUNS, {});
  var ws = getWeekStart();
  if (data.weekStart !== ws) {
    data.weeklyKm = 0;
    data.weekStart = ws;
  }
  return {
    runs: data.runs || [],
    weeklyKm: data.weeklyKm || 0,
    streak: data.streak || 0,
    lastRunDate: data.lastRunDate || null,
    weekStart: data.weekStart || ws,
    stravaSync: data.stravaSync || 0
  };
}
function saveRun(entry) {
  var s = loadRuns(),
    today = todayStr();
  s.runs = [Object.assign({}, entry, {
    date: today
  })].concat(s.runs).slice(0, 200);
  s.weeklyKm = Math.round((s.weeklyKm + (parseFloat(entry.distKm) || 0)) * 10) / 10;
  var yd = new Date(Date.now() - 86400000).toISOString().split('T')[0];
  if (!s.lastRunDate || s.lastRunDate === yd) {
    if (s.lastRunDate !== today) s.streak = (s.streak || 0) + 1;
  } else if (s.lastRunDate !== today) s.streak = 1;
  s.lastRunDate = today;
  store(K.RUNS, s);
  return s;
}
function mergeStravaRuns(stravaRuns) {
  var s = loadRuns();
  var existing = s.runs || [];
  var existIds = {};
  existing.forEach(function (r) {
    if (r.stravaId) existIds[r.stravaId] = true;
  });
  var newOnes = stravaRuns.filter(function (r) {
    return !existIds[r.stravaId];
  });
  if (!newOnes.length) return s;
  var merged = newOnes.concat(existing).sort(function (a, b) {
    return b.date > a.date ? 1 : -1;
  }).slice(0, 200);
  s.runs = merged;
  var ws = getWeekStart();
  s.weeklyKm = Math.round(merged.filter(function (r) {
    return r.date && r.date >= ws;
  }).reduce(function (acc, r) {
    return acc + (parseFloat(r.distKm) || 0);
  }, 0) * 10) / 10;
  if (merged.length > 0) s.lastRunDate = merged[0].date || s.lastRunDate;
  s.stravaSync = Date.now();
  store(K.RUNS, s);
  return s;
}
function loadLog() {
  return load(K.LOG, {});
}
function saveLog(date, data) {
  var l = loadLog();
  l[date] = Object.assign({}, l[date] || {}, data);
  store(K.LOG, l);
}
function loadBrief() {
  return load(K.BRIEF, {});
}
// Coach memory — cross-session context (separate from daily log)
var CMEM = 'p_cmem';
function loadCoachMem() {
  return load(CMEM, {});
}
function saveCoachMem(patch) {
  var m = Object.assign({}, loadCoachMem(), patch, {
    updatedAt: Date.now()
  });
  store(CMEM, m);
}
function saveBrief(date, text) {
  var b = loadBrief();
  b[date] = text;
  store(K.BRIEF, b);
}
function getCoachContext() {
  var log = loadLog(),
    runs = loadRuns().runs || [];
  var days = [];
  for (var i = 5; i >= 1; i--) {
    var d = new Date(Date.now() - i * 86400000).toISOString().split('T')[0];
    var entry = log[d] || {};
    var run = runs.find(function (r) {
      return r.date === d;
    });
    days.push({
      date: d,
      label: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date(d + 'T12:00:00').getDay()],
      sleep: entry.sleep || null,
      feel: entry.feel || null,
      ran: !!run,
      km: run ? run.distKm : 0,
      type: run ? run.type : 'rest',
      note: entry.note || null
    });
  }
  var todayLog = log[todayStr()] || {};
  return {
    days: days,
    todaySleep: todayLog.sleep || null,
    todayMeal: todayLog.meal || null
  };
}

};
function getStaticWeather(city) {
  var month = new Date().getMonth();
  var hour = new Date().getHours();
  var d = SEASONAL[city] || SEASONAL.Bengaluru;
  var row = d[month];
  var aqi = row[0],
    base = row[1],
    hum = row[2];
  // Time-of-day temperature offset (same logic as coach-brain.js)
  var tOff = hour < 6 ? -7 : hour < 9 ? -3 : hour < 13 ? 3 : hour < 17 ? 6 : hour < 20 ? 2 : -4;
  var temp = Math.round(base + tOff);
  return {
    aqi: aqi,
    temp: temp,
    humidity: hum
  };
}
function pm25toAQI(pm) {
  if (pm <= 12) return Math.round(pm * 50 / 12);
  if (pm <= 35.4) return Math.round(51 + (pm - 12.1) * 49 / 23.3);
  if (pm <= 55.4) return Math.round(101 + (pm - 35.5) * 49 / 19.9);
  if (pm <= 150.4) return Math.round(151 + (pm - 55.5) * 49 / 94.9);
  if (pm <= 250.4) return Math.round(201 + (pm - 150.5) * 99 / 99.9);
  return Math.round(301 + (pm - 250.5) * 100 / 149.9);
}
async function fetchLiveWeather(city) {
  var cKey = 'pw_' + city;
  var cached = load(cKey, null);
  if (cached && Date.now() - cached.ts < 1800000) return cached.d; // 30min cache
  // Try Netlify function first (OWM_KEY is server-side)
  try {
    var fr = await fetch('/.netlify/functions/weather?city=' + encodeURIComponent(city));
    if (fr.ok) {
      var d = await fr.json();
      store(cKey, {
        ts: Date.now(),
        d: d
      });
      return d;
    }
  } catch (fe) {}
  // Fallback: direct call with user's OWM key
  var owmKey = gk('pacer_owm_key');
  if (!owmKey) return null;
  var coords = COORDS[city];
  if (!coords) return null;
  try {
    var wUrl = 'https://api.openweathermap.org/data/2.5/weather?lat=' + coords.lat + '&lon=' + coords.lon + '&appid=' + owmKey + '&units=metric';
    var aUrl = 'https://api.openweathermap.org/data/2.5/air_pollution?lat=' + coords.lat + '&lon=' + coords.lon + '&appid=' + owmKey;
    var wRes = await fetch(wUrl);
    var aRes = await fetch(aUrl);
    if (!wRes.ok || !aRes.ok) return null;
    var wData = await wRes.json();
    var aData = await aRes.json();
    var temp = Math.round(wData.main.temp);
    var humidity = wData.main.humidity;
    var pm25 = aData.list[0].components.pm2_5;
    var aqi = pm25toAQI(pm25);
    var desc = wData.weather[0].description;
    var d = {
      temp: temp,
      humidity: humidity,
      aqi: aqi,
      pm25: Math.round(pm25 * 10) / 10,
      desc: desc,
      live: true,
      wind: Math.round(wData.wind && wData.wind.speed || 0)
    };
    store(cKey, {
      ts: Date.now(),
      d: d
    });
    return d;
  } catch (err) {
    return null;
  }
}
function hiCalc(temp, hum) {
  return Math.round(temp + 0.33 * (hum / 100 * 6.105 * Math.exp(17.27 * temp / (237.3 + temp))) - 4);
}
function thermalCalc(heatIdx, hum) {
  return Math.round(Math.max(0, (heatIdx - 28) * 5 + Math.max(0, hum - 60) / 10 * 3));
}
function getVerdict(aqi, heatIdx) {
  if (aqi > 200) return {
    v: 'REST',
    c: '#64748B',
    label: 'Air quality unsafe — do not run outside'
  };
  if (heatIdx > 40) return {
    v: 'WAIT',
    c: '#FB923C',
    label: 'Heat index dangerous — wait for evening'
  };
  if (aqi > 150) return {
    v: 'WAIT',
    c: '#FB923C',

  };
  if (heatIdx > 33 || aqi > 100) return {

}

// ─── STRAVA ───────────────────────────────────────────────────────────────────
async function refreshStravaToken() {
  var refresh = gk('pacer_strava_refresh');
  if (!refresh) return null;
  // Try Netlify function first
  try {
    var fr = await fetch('/.netlify/functions/strava-refresh', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        refresh_token: refresh
      })
    });
    if (fr.ok) {
      var fd = await fr.json();
      if (fd.access_token) {
        sk('pacer_strava_token', fd.access_token);
        sk('pacer_strava_refresh', fd.refresh_token);
        sk('pacer_strava_expiry', String(fd.expires_at));
        return fd.access_token;
      }
    }
  } catch (fe) {}
  // Fallback: direct refresh with user's credentials
  var cid = gk('pacer_strava_id'),
    secret = gk('pacer_strava_secret');
  if (!cid || !secret) return null;
  try {
    var r = await fetch('https://www.strava.com/oauth/token', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        client_id: cid,
        client_secret: secret,
        refresh_token: refresh,
        grant_type: 'refresh_token'
      })
    });
    if (!r.ok) return null;
    var d = await r.json();
    if (d.access_token) {
      sk('pacer_strava_token', d.access_token);
      sk('pacer_strava_refresh', d.refresh_token);
      sk('pacer_strava_expiry', String(d.expires_at));
      return d.access_token;
    }
    return null;
  } catch (err) {
    return null;
  }
}
async function getStravaToken() {
  var token = gk('pacer_strava_token');
  if (!token) return null;
  var expiry = parseInt(gk('pacer_strava_expiry') || '0');
  if (expiry && Date.now() / 1000 > expiry - 300) return refreshStravaToken();
  return token;
}
async function exchangeStravaCode(code) {
  // Try Netlify function (CLIENT_SECRET is server-side)
  try {
    var fr = await fetch('/.netlify/functions/strava-callback', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        code: code
      })
    });
    if (fr.ok) {
      var fd = await fr.json();
      if (fd.access_token) {
        sk('pacer_strava_token', fd.access_token);
        sk('pacer_strava_refresh', fd.refresh_token);
        sk('pacer_strava_expiry', String(fd.expires_at));
        return true;
      }
    }
  } catch (fe) {}
  // Fallback: direct exchange with user's credentials
  var cid = gk('pacer_strava_id'),
    secret = gk('pacer_strava_secret');
  if (!cid || !secret) return false;
  try {
    var r = await fetch('https://www.strava.com/oauth/token', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        client_id: cid,
        client_secret: secret,
        code: code,
        grant_type: 'authorization_code'
      })
    });
    if (!r.ok) return false;
    var d = await r.json();
    if (d.access_token) {
      sk('pacer_strava_token', d.access_token);
      sk('pacer_strava_refresh', d.refresh_token);
      sk('pacer_strava_expiry', String(d.expires_at));
      return true;
    }
    return false;
  } catch (err) {
    return false;
  }
}
async function syncStravaActivities() {
  var token = await getStravaToken();
  if (!token) return null;
  try {
    var after = Math.floor((Date.now() - 30 * 86400000) / 1000);
    var r = await fetch('https://www.strava.com/api/v3/athlete/activities?after=' + after + '&per_page=50', {
      headers: {
        Authorization: 'Bearer ' + token
      }
    });
    if (!r.ok) return null;
    var acts = await r.json();
    var runs = acts.filter(function (a) {
      return a.type === 'Run' || a.sport_type === 'Run';
    }).map(function (a) {
      return {
        name: a.name || 'Run',
        type: 'run',
        label: 'Run',
        distKm: Math.round(a.distance / 100) / 10,
        dist: Math.round(a.distance / 100) / 10 + 'km',
        mins: Math.round(a.moving_time / 60),
        t: fmtTime(a.moving_time),
        pace: a.average_speed > 0 ? fmtPace(a.average_speed) : null,
        heartRate: a.average_heartrate ? Math.round(a.average_heartrate) : null,
        feel: 'good',
        ok: true,
        date: a.start_date.split('T')[0],
        stravaId: a.id,
        source: 'strava'
      };
    });
    return mergeStravaRuns(runs);
  } catch (err) {
    return null;
  }
}
function stravaAuthUrl() {
  var cid = gk('pacer_strava_id');
  if (!cid) return null;
  var base = window.location.href.split('?')[0].split('#')[0];
  return 'https://www.strava.com/oauth/authorize?client_id=' + cid + '&redirect_uri=' + encodeURIComponent(base) + '&response_type=code&approval_prompt=auto&scope=activity:read_all';
}
