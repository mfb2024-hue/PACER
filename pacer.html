function getStaticWeather(city) {

  var row = d[month];

function getWeekForecast(city, days) {
  var forecast = [];
  for (var i = 1; i <= days; i++) {
    var d = new Date(Date.now() + i * 86400000);

    var row = (SEASONAL[city] || SEASONAL.Bengaluru)[month];

function pm25toAQI(pm) {
  if (pm <= 12) return Math.round(pm * 50 / 12);
  if (pm <= 35.4) return Math.round(51 + (pm - 12.1) * 49 / 23.3);
  if (pm <= 55.4) return Math.round(101 + (pm - 35.5) * 49 / 19.9);
  if (pm <= 150.4) return Math.round(151 + (pm - 55.5) * 49 / 94.9);
  if (pm <= 250.4) return Math.round(201 + (pm - 150.5) * 99 / 99.9);

}

async function fetchLiveWeather(city) {
  var cKey = 'pw_' + city;
  var cached = load(cKey, null);
  if (cached && Date.now() - cached.ts < 1800000) return cached.d;

  // Try Netlify function first (proxies Open-Meteo, better caching)
  try {
    var fr = await fetch('/.netlify/functions/weather?city=' + encodeURIComponent(city));
    if (fr.ok) {
      var d = await fr.json();
      if (d.aqi !== undefined) {
        store(cKey, {
          ts: Date.now(),
          d: d
        });
        return d;
      }
    }
  } catch (fe) {}

  // Direct Open-Meteo call as fallback (no API key needed)
  var coords = COORDS[city];
  if (!coords) return null;
  try {
    var wRes = await fetch('https://api.open-meteo.com/v1/forecast?latitude=' + coords.lat + '&longitude=' + coords.lon + '&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m' + '&forecast_days=1&timezone=auto');
    var aRes = await fetch('https://air-quality-api.open-meteo.com/v1/air-quality?latitude=' + coords.lat + '&longitude=' + coords.lon + '&current=pm2_5,us_aqi&forecast_days=1');
    if (!wRes.ok || !aRes.ok) return null;
    var wData = await wRes.json();
    var aData = await aRes.json();
    var cur = wData.current;
    var aqCur = aData.current;
    var d3 = {
      temp: Math.round(cur.temperature_2m),
      humidity: Math.round(cur.relative_humidity_2m),
      feelsLike: Math.round(cur.apparent_temperature),
      aqi: Math.round(aqCur.us_aqi || 0),
      pm25: Math.round((aqCur.pm2_5 || 0) * 10) / 10,
      wind: Math.round(cur.wind_speed_10m),
      live: true,
      source: 'open-meteo'
    };
    store(cKey, {
      ts: Date.now(),
      d: d3
    });
    return d3;
  } catch (err) {
    return null;
  }
}

async function callClaude(system, user, maxTok, model) {
  var mdl = model || MODEL_DEEP;
  try {
    var fr = await fetch('/.netlify/functions/coach', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        system: system,
        user: user,
        max_tokens: maxTok || 200,
        model: mdl
      })
    });
    if (fr.ok) {
      var fd = await fr.json();
      return fd.response || fd.content && fd.content[0] && fd.content[0].text || '';
    }
  } catch (fe) {}
  var key = getApiKey();
  if (!key) throw new Error('no key');
  var r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      model: mdl,
      max_tokens: maxTok || 200,
      system: system,
      messages: [{
        role: 'user',
        content: user
      }]
    })
  });
  var d = await r.json();
  return d.content && d.content[0] && d.content[0].text || '';
}
async function askCoach(userMsg, ctxStr) {
  var hour = new Date().getHours();
  var timeCtx = hour < 11 ? 'morning' : hour < 16 ? 'afternoon' : hour < 21 ? 'evening' : 'night';
  var foodWords = ['ate', 'eat', 'had', 'milk', 'roti', 'rice', 'bread', 'banana', 'protein', 'dal', 'chai', 'coffee', 'water', 'sattu', 'egg', 'oats', 'dosa', 'idli', 'poha', 'curd', 'paneer'];
  var isFoodMsg = foodWords.some(function (w) {
    return userMsg.toLowerCase().includes(w);
  });
  var system = isFoodMsg ? 'You are PACER, an Indian running coach with nutrition expertise. It is ' + timeCtx + ' (' + hour + ':00). Analyze what the runner ate in context of: their training today, the time of day, and what they still need for recovery or fueling. Be specific. Suggest exactly what to eat next and when. Know Indian food deeply. 2-3 sentences max.' : 'You are PACER, Indian running coach. 2-3 sentences. End with one clear action. Know Indian food and conditions. Never start with I.';
  return callClaude(system, 'Context: ' + ctxStr + '\nRunner: "' + userMsg + '"', 160, MODEL_FAST);
}
async function getSwapExplanation(city, sessType, daysAhead, weather) {
  var wd = weather || getStaticWeather(city);
  var hi = hiCalc(wd.temp, wd.humidity);
  var verd = getVerdict(wd.aqi, hi);
  var forecast = getWeekForecast(city, 4);
  var forecastStr = forecast.map(function (d) {
    return d.day + ':AQI' + d.aqi + ' ' + d.verdict;
  }).join(', ');
  return callClaude('You are PACER. 2-3 sentences. Explain why the swap makes sense using actual forecast data. End by confirming weekly load stays same.', 'City:' + city + ' Today: AQI ' + wd.aqi + ' (' + verd.v + '). Swapping ' + sessType + ' to easy run. Next 4 days: ' + forecastStr + '. Best day for ' + sessType + ': day ' + daysAhead + '.', 140, MODEL_FAST);
}

    return d.day + ':AQI' + d.aqi + '(' + d.verdict + ')';
