[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/"
  to = "/pacer.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/pacer.html"
  status = 200

[[redirects]]
  from = "/api/weather"
  to = "/.netlify/functions/weather"
  status = 200

[[redirects]]
  from = "/api/coach"
  to = "/.netlify/functions/coach"
  status = 200

[[redirects]]
  from = "/api/strava/callback"
  to = "/.netlify/functions/strava-callback"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
